name: Vendor body assets

on:
  push:
    paths:
      - '.github/workflows/vendor-body-assets.yml'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SVG renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Download verified CC0 body figures
        run: |
          mkdir -p assets/body
          curl --fail --location --retry 3 \
            'https://upload.wikimedia.org/wikipedia/commons/2/2c/Human_silhouette_gender_neutral_front.svg' \
            --output assets/body/body-front.svg
          curl --fail --location --retry 3 \
            'https://upload.wikimedia.org/wikipedia/commons/8/85/Human_silhouette_gender_neutral_back.svg' \
            --output assets/body/body-back.svg
          test -s assets/body/body-front.svg
          test -s assets/body/body-back.svg

      - name: Render transparent local PNGs
        run: |
          rsvg-convert --keep-aspect-ratio --width 559 --height 1204 \
            assets/body/body-front.svg > assets/body/body-front.png
          rsvg-convert --keep-aspect-ratio --width 559 --height 1190 \
            assets/body/body-back.svg > assets/body/body-back.png
          test -s assets/body/body-front.png
          test -s assets/body/body-back.png
          file assets/body/body-front.png assets/body/body-back.png

      - name: Commit vendored assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/body/body-front.svg assets/body/body-back.svg assets/body/body-front.png assets/body/body-back.png
          if git diff --cached --quiet; then
            echo 'Body assets already current.'
            exit 0
          fi
          git commit -m 'Add bundled body map PNG assets'
          git push
