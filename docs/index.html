<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HealthLit</title>
  <meta name="description" content="HealthLit support and privacy information." />
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f7f4fb; color: #241f2b; }
    main { max-width: 720px; margin: 0 auto; padding: 56px 24px 72px; }
    .card { background: #fff; border: 1px solid #e7dfea; border-radius: 24px; padding: 32px; box-shadow: 0 12px 40px rgba(49,35,58,.06); }
    h1 { margin: 0 0 8px; font-size: 36px; }
    p { line-height: 1.65; }
    nav { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
    a { color: #6b55c9; font-weight: 700; }
    .button { display: inline-block; text-decoration: none; border: 1px solid #d8cfee; border-radius: 999px; padding: 11px 16px; }
    .muted { color: #6f6775; }
    @media (prefers-color-scheme: dark) {
      body { background: #18141f; color: #f6f0f7; }
      .card { background: #211b29; border-color: #3b3147; box-shadow: none; }
      .muted { color: #c8bdcc; }
      a { color: #c7b7ff; }
      .button { border-color: #4b3d5a; }
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>HealthLit</h1>
      <p>A local-first symptom diary that helps you organize what you recorded for yourself and your appointments.</p>
      <p class="muted">HealthLit is not a medical device and does not diagnose conditions, establish causes, predict outcomes, or recommend treatment.</p>
      <nav aria-label="HealthLit information">
        <a class="button" href="privacy.html">Privacy Policy</a>
        <a class="button" href="support.html">Support</a>
      </nav>
    </section>
  </main>
</body>
</html>
